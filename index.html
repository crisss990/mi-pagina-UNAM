<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universidad Nacional Autónoma de México</title>

    <style>
        h1, h4 {
            margin-top: 0px;
            text-align: center;
        }

        header {
            background-color: yellow;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
        }

        nav {
            background-color: white;
        }

        nav ul {
            margin-left: 400px;
            padding-top: 20px;
            margin-top: 0px;
            list-style: NONE;
            DISPLAY: FLEX;
        }

        nav ul li {
            background-color: lime;
            width: 150px;
            margin-left: 20px;
            text-align: center;
            padding: 5px 0;
        }

        nav ul li:hover {
            background-color: white;
        }

        nav a {
            text-decoration: none;
            color: black;
            font-weight: bold;
            display: block;
        }

        #principal {
            display: flex;
            margin-top: 10px;
        }

        section {
            background-color: aqua;
            flex: 3;
            min-height: 420px;
            padding: 15px;
        }

        aside {
            background-color: aqua;
            margin-left: 20px;
            flex: 2;
            min-height: 420px;
            padding: 15px;
        }

        footer {
            background-color: silver;
            height: 80px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ESTILOS DEL FORMULARIO */
        aside label {
            display: block;
            font-weight: bold;
            margin-top: 8px;
            font-size: 14px;
        }

        aside input {
            width: 100%;
            padding: 6px;
            margin-top: 2px;
            margin-bottom: 6px;
            border: 1px solid #333;
            border-radius: 4px;
            box-sizing: border-box;
        }

        aside button {
            margin-top: 8px;
            padding: 6px 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .datos-resultado {
            margin-top: 15px;
            padding: 10px;
            background-color: white;
            border-radius: 5px;
            border: 1px solid #999;
        }

        .datos-resultado p {
            margin: 5px 0;
            font-size: 14px;
            line-height: 1.3;
        }
    </style>

    <script>
        function excel() {
            alert('Excel es una hoja de cálculo.');
        }

        function power() {
            alert('PowerPoint es un programa para presentaciones.');
        }

        function access() {
            alert('Access es un sistema gestor de bases de datos.');
        }

        function guardarDatos(event) {
            event.preventDefault();

            let cuenta = document.getElementById("cuenta").value;
            let nombre = document.getElementById("nombre").value;
            let carrera = document.getElementById("carrera").value;
            let semestre = document.getElementById("semestre").value;

            document.getElementById("mostrarCuenta").textContent = cuenta;
            document.getElementById("mostrarNombre").textContent = nombre;
            document.getElementById("mostrarCarrera").textContent = carrera;
            document.getElementById("mostrarSemestre").textContent = semestre;

            document.getElementById("datosAlumno").style.display = "block";

            alert("¡Datos del alumno guardados con éxito!");
        }
    </script>
</head>

<body>

    <header>
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/Escudo-UNAM-escalable.svg" width="80" height="80" alt="UNAM">
        <h1 style="flex:2">Universidad Nacional Autónoma de México</h1>
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/Escudo-UNAM-escalable.svg" width="80" height="80" alt="UNAM">
    </header>

    <nav>
        <ul>
            <li><a href="https://www.cuautitlan.unam.mx" target="_blank">FESC</a></li>
            <li><a href="https://www.youtube.com" target="_blank">YOUTUBE</a></li>
        </ul>
    </nav>

    <div id="principal">

        <section>
            <h1>Conceptos</h1>
            <hr width="50%">
            <center>
                <button onclick="alert('Word es un procesador de texto')">Word</button><br><br>
                <button onclick="excel()">Excel</button><br><br>
                <button onclick="power()">Powerpoint</button><br><br>
                <button onclick="access()">Access</button><br><br>
            </center>
        </section>

        <aside>
            <h1>Datos del alumno</h1>
            <hr width="50%">

            <!-- FORMULARIO PARA CAPTURAR DATOS -->
            <form onsubmit="guardarDatos(event)">
                <label for="cuenta">Número de Cuenta:</label>
                <input type="text" id="cuenta" placeholder="Ingresa tu número de cuenta" required>

                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" placeholder="Ingresa tu nombre" required>

                <label for="carrera">Carrera:</label>
                <input type="text" id="carrera" placeholder="Ingresa tu carrera" required>

                <label for="semestre">Semestre:</label>
                <input type="text" id="semestre" placeholder="Ej. 1.er Semestre" required>

                <center>
                    <button type="submit">Guardar Datos</button>
                </center>
            </form>

            <!-- CONTENEDOR PARA MOSTRAR LOS DATOS INGRESADOS -->
            <div id="datosAlumno" class="datos-resultado" style="display: none;">
                <p><strong>Número de Cuenta:</strong> <span id="mostrarCuenta"></span></p>
                <p><strong>Nombre:</strong> <span id="mostrarNombre"></span></p>
                <p><strong>Carrera:</strong> <span id="mostrarCarrera"></span></p>
                <p><strong>Semestre:</strong> <span id="mostrarSemestre"></span></p>
            </div>
        </aside>

    </div>

    <footer>
        <h4>Licenciatura en Informática</h4>
    </footer>

</body>

</html>
