<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universidad Nacional Autónoma de México</title>

    <style>
        h1, h4 {
            margin-top: 0px;
            text-align: center;
        }

        header {
            background-color: yellow;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
        }

        nav {
            background-color: white;
        }

        nav ul {
            margin-left: 400px;
            padding-top: 20px;
            margin-top: 0px;
            list-style: NONE;
            DISPLAY: FLEX;
        }

        nav ul li {
            background-color: lime;
            width: 150px;
            margin-left: 20px;
            text-align: center;
            padding: 5px 0;
        }

        nav ul li:hover {
            background-color: white;
        }

        nav a {
            text-decoration: none;
            color: black;
            font-weight: bold;
            display: block;
        }

        #principal {
            display: flex;
            margin-top: 10px;
        }

        section {
            background-color: aqua;
            flex: 3;
            height: 380px;
            padding: 15px;
        }

        aside {
            background-color: aqua;
            margin-left: 20px;
            flex: 2;
            height: 380px;
            padding: 15px;
        }

        footer {
            background-color: silver;
            height: 80px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .datos-alumno p {
            font-size: 16px;
            margin: 12px 0;
            line-height: 1.4;
        }
    </style>

    <script>
        function excel() {
            alert('Excel es una hoja de cálculo.');
        }

        function power() {
            alert('PowerPoint es un programa para presentaciones.');
        }

        function access() {
            alert('Access es un sistema gestor de bases de datos.');
        }
    </script>
</head>

<body>

    <header>
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/Escudo-UNAM-escalable.svg" width="80" height="80" alt="UNAM">
        <h1 style="flex:2">Universidad Nacional Autónoma de México</h1>
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/Escudo-UNAM-escalable.svg" width="80" height="80" alt="UNAM">
    </header>

    <nav>
        <ul>
            <li><a href="https://www.cuautitlan.unam.mx" target="_blank">FESC</a></li>
            <li><a href="https://www.youtube.com" target="_blank">YOUTUBE</a></li>
        </ul>
    </nav>

    <div id="principal">

        <section>
            <h1>Conceptos</h1>
            <hr width="50%">
            <center>
                <button onclick="alert('Word es un procesador de texto')">Word</button><br><br>
                <button onclick="excel()">Excel</button><br><br>
                <button onclick="power()">Powerpoint</button><br><br>
                <button onclick="access()">Access</button><br><br>
            </center>
        </section>

        <aside>
            <h1>Datos del alumno</h1>
            <hr width="50%">

            <div class="datos-alumno">
                <p><strong>Número de Cuenta:</strong> 320000000</p>
                <p><strong>Nombre:</strong> Cristian Santiago Espinosa Jimenez</p>
                <p><strong>Carrera:</strong> Licenciatura en Informática</p>
                <p><strong>Semestre:</strong> 1.er Semestre</p>
            </div>
        </aside>

    </div>

    <footer>
        <h4>Licenciatura en Informática</h4>
    </footer>

</body>

</html>
